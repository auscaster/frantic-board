name: Bounty
description: Request a new bounty or document a specific task requirement.
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new bounty or document specific technical requirements for existing tasks (e.g., NitroMTA installation steps).
  - type: input
    id: bounty_title
    attributes:
      label: Bounty Title
      placeholder: "e.g., Install NitroMTA and send test email"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "Define the binary success conditions (e.g., 'Command exits 0', 'Email received at proof@nitromta.com')."
    validations:
      required: true
  - type: input
    id: bounty_price
    attributes:
      label: Price (USD)
      placeholder: "2"
    validations:
      required: true