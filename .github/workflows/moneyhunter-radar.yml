name: MoneyHunter hourly radar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Query live paid-opportunity radar
        shell: bash
        run: |
          set -euo pipefail
          url="https://moneyhunter-preflight.onrender.com/v1/radar?min_reward=5&limit=50&sources=frantic,github,algora,opire"
          for i in 1 2 3; do
            if curl --fail --silent --show-error --location --max-time 30 "$url" -o radar.json; then
              break
            fi
            sleep 5
          done
          test -s radar.json
          python scripts/moneyhunter-gate.py radar.json decision.json
          cat decision.json
      - name: Save radar and decision
        uses: actions/upload-artifact@v4
        with:
          name: moneyhunter-radar-${{ github.run_id }}
          path: |
            radar.json
            decision.json
          retention-days: 14
